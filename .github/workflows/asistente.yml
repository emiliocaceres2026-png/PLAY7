name: Ejecutar Asistente PLAY7

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: asistente-userbot-singleton
  cancel-in-progress: true

jobs:
  run-asistente:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Diagnostico - Ver archivos reales en la raiz
        run: |
          echo "=== ARCHIVOS EN EL RUNNER ==="
          ls -la
          echo "============================="

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install telethon cryptg

      - name: Ejecutar PLAY7.py
        run: |
          python -u PLAY7.py
