name: Ejecutar Asistente PLAY7

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: asistente-userbot-singleton
  cancel-in-progress: true

jobs:
  run-asistente:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install telethon cryptg

      - name: Restaurar archivo de sesion
        env:
          SESSION_DATA: ${{ secrets.TELETHON_SESSION_BASE64 }}
        run: |
          if [ -n "$SESSION_DATA" ]; then
            echo "$SESSION_DATA" | base64 --decode > sesion_nueva_prueba_2.session
            echo "✅ Archivo sesion_nueva_prueba_2.session restaurado con exito"
          else
            echo "❌ No se encontro el Secret TELETHON_SESSION_BASE64"
          fi

      - name: Ejecutar PLAY7.py
        run: |
          python -u PLAY7.py
